# Keep this workflow's path/name so the iOS run-number sequence is retained.
# This now prepares coordinated artifacts. It never publishes a release.
name: iOS App

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Platforms to prepare (build only, no publication)
        type: choice
        default: all
        options: [all, edge, ios, orion]
  push:
    paths:
      - "shared/**"
      - "edge-extension/**"
      - "ios-app/**"
      - "orion-ios/**"
      - "cloud/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: prepare-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_targets: ${{ steps.plan.outputs.has_targets }}
      ios: ${{ steps.plan.outputs.ios }}
      extension_targets: ${{ steps.plan.outputs.extension_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - id: plan
        run: node scripts/plan-ci-release.js
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: dist/release-plan.json
          if-no-files-found: error
          retention-days: 14

  checks:
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:edge

  extensions:
    needs: [plan, checks]
    if: needs.plan.outputs.extension_targets != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Prepare requested extension packages
        env:
          TARGETS: ${{ needs.plan.outputs.extension_targets }}
        run: node scripts/prepare-client-packages.js --targets "$TARGETS" --out dist/client-packages
      - uses: actions/upload-artifact@v4
        with:
          name: client-extensions
          path: |
            dist/client-packages/*.zip
            dist/client-packages/*.xpi
            dist/client-packages/*.receipt.json
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: [plan, checks]
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/native-ios.yml
    with:
      build_number: ${{ format('{0}', github.run_number) }}

  assemble:
    needs: [plan, checks, extensions, ios]
    if: >-
      ${{ always() && needs.plan.result == 'success' && needs.checks.result == 'success' &&
          (needs.extensions.result == 'success' || needs.extensions.result == 'skipped') &&
          (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TASU_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: dist/prepared-release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: dist/prepared-release
      - name: Reject missing, mixed-version or damaged packages
        run: node scripts/verify-release-bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: TasuDownloader-prepared-release
          path: dist/prepared-release/*
          if-no-files-found: error
          retention-days: 14
