name: Native iOS build (reusable)

on:
  workflow_call:
    inputs:
      build_number:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      TASU_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          test -n "$newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Swift and JavaScriptCore parity
        run: npm run test:native
      # test:native builds the payload. Stamp it only after all regeneration.
      - run: node scripts/stage-ios-package.js stamp
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          mkdir -p ios-app/Generated
          xcodegen generate --spec ios-app/project.yml --project ios-app
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios-app/TasuDownloader.xcodeproj \
            -scheme TasuDownloader \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            MARKETING_VERSION="$(node scripts/ios-version.js)" \
            CURRENT_PROJECT_VERSION="$TASU_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Preserve native failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Package and verify native app
        run: |
          mkdir -p dist Payload
          cp -R "build/Build/Products/Release-iphoneos/TasuDownloader.app" Payload/
          zip -qry "dist/TasuDownloader.ipa" Payload
          node scripts/stage-ios-package.js record
      - uses: actions/upload-artifact@v4
        with:
          name: client-ios
          path: dist/ios-package/*
          if-no-files-found: error
          retention-days: 14
