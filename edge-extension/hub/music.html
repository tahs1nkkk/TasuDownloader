<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotify / YouTube</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="music.css"></head><body><main class="music-app">
<div class="connection-bar"><span id="status" role="status" data-state="connecting">Motor bağlanıyor…</span><button id="reconnect" title="Bağlantıyı yenile" aria-label="Bağlantıyı yenile">↻</button></div>
<section id="engineProgress" class="engine-progress" aria-live="polite"><div><span id="engineStage">Windows yardımcısı aranıyor</span><strong id="enginePercent">0%</strong></div><progress id="engineProgressBar" max="100" value="0"></progress></section>
<section id="helperSetup" class="card" hidden><h3>Motor bağlantısı kurulamadı</h3><p id="helperMessage"></p><button id="diagnoseConnection" class="primary">Bağlantıyı denetle</button><section id="connectionReportPanel" hidden><p id="connectionSummary" role="status"></p><textarea id="connectionReport" readonly rows="7" aria-label="Müzik bağlantı raporu"></textarea><button id="copyConnectionReport">Raporu kopyala</button><small>Rapor yalnız bağlantı bilgilerini içerir.</small></section><details><summary>Kurulum</summary><p>native-music/install.ps1 dosyasını bu eklenti kimliğiyle çalıştır:</p><code id="extensionId"></code><p>İzin vermek, Windows yardımcısını kurmaz.</p></details></section>
<section class="search-card"><label for="query">Bağlantı veya şarkı adı</label><div class="search-row"><input id="query" placeholder="YouTube / Spotify" autocomplete="off"><button id="preview" class="primary">Ara</button></div><div class="format-row"><label>Biçim<select id="fmt"><option value="mp3">MP3 · Ses</option><option value="mp4">MP4 · Video</option></select></label><label id="audioQuality">Ses kalitesi<select id="preset"><option value="yuksek">256 kbps</option><option value="en_yuksek">320 kbps</option><option value="orta">192 kbps</option><option value="dusuk">128 kbps</option></select></label><label id="videoQuality" hidden>Video kalitesi<select id="video_quality"><option value="1080">1080p</option><option value="best">Kaynağın en iyisi</option><option value="2160">2160p · 4K</option><option value="1440">1440p · 2K</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select></label></div></section>
<div class="utility-bar"><button id="toggleAccount"><img src="../assets/hub/spotify-original.png" alt="">Spotify</button><button id="toggleMusicOptions">İndirme ayarları</button><button id="toggleFolder">Klasör</button></div>
<section id="accountPanel" class="card" hidden><div class="account-actions"><button id="login">Spotify ile giriş</button><button id="logout" class="subtle">Çıkış</button></div><div class="library-actions"><button id="library">Çalma listelerim</button><button id="liked">Beğenilenler</button></div><div id="libraryList"></div></section>
<section id="folderPanel" class="card" hidden><p id="downloadDirectory"></p><div class="row-actions"><button id="folder">Klasör seç</button><button id="openFolder">Klasörü aç</button><button id="resetFolder" class="subtle">Varsayılana dön</button></div></section>
<section id="musicOptions" class="card" hidden></section>
<div id="tracks"></div><button id="download" class="primary download-button" disabled>Seçilenleri indir</button>
<section class="jobs-section"><div class="section-heading"><h3>İndirmeler</h3><button id="refreshJobs" class="subtle">Yenile</button></div><div id="jobs"></div></section>
<div id="notice" role="status" hidden></div></main><script src="music-options.js"></script><script src="music-diagnostics.js"></script><script src="music.js"></script></body></html>
